[package]
name = "autolayout-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser ABI for Copperline deterministic KiCad AutoLayout"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kicad-layout = { path = "../kicad-layout" }
layout-core = { path = "../layout-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
