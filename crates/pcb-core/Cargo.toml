[package]
name = "pcb-core"
version = "0.1.0"
edition = "2021"
description = "KiCad PCB to printable raised-trace STL geometry core"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
earcutr = "0.4"
i_overlay = { version = "=7.0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
